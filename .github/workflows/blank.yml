# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "develop" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Set image version
        id: set_version
        run: echo "IMAGE_VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
        
      - name: Build Docker image
        run: |
          docker build -t localhost:5000/asdu-app:${{ env.IMAGE_VERSION }} .
          
      - name: Save Docker image to tar file
        run: docker save -o asdu.tar localhost:5000/asdu-app:${{ env.IMAGE_VERSION }}

      - name: Transfer image to server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no asdu.tar $SSH_USER@$SERVER_IP:/home/epiis/devops/pipeline/

      - name: Copy deployment.yml to server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sed 's/IMAGE_VERSION/${{ env.IMAGE_VERSION }}/g' 06-deployment-asdu-app.yaml > deployment-asdu-app.yaml
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no deployment-asdu-app.yaml $SSH_USER@$SERVER_IP:/home/epiis/devops/pipeline/

      - name: Connect to server and rebuild Docker image
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP 'cd /home/epiis/devops/pipeline && docker load -i asdu.tar'

      - name: Connect to server and push Docker image to local registry
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP 'docker push localhost:5000/asdu-app:${{ env.IMAGE_VERSION }}'

      - name: Connect to server and apply deployment
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP 'cd /home/epiis/devops/pipeline && kubectl apply -f deployment-asdu-app.yaml'
    
